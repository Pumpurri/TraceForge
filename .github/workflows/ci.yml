name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install C++ dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          libgrpc++-dev
          libprotobuf-dev
          protobuf-compiler
          protobuf-compiler-grpc

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTRACEFORGE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  flutter-analyze-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/flutter_sensor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
