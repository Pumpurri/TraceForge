syntax = "proto3";

package traceforge.v1;

// Identifies the clock that produced source_timestamp_ns. Clock domains must
// not be compared until an explicit offset has been estimated.
enum ClockDomain {
  CLOCK_DOMAIN_UNSPECIFIED = 0;
  CLOCK_DOMAIN_UTC = 1;
  CLOCK_DOMAIN_DEVICE_MONOTONIC = 2;
}

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message GpsFix {
  double latitude_degrees = 1;
  double longitude_degrees = 2;
  double horizontal_accuracy_meters = 3;
  bool is_mocked = 4;
}

message Temperature {
  double degrees_celsius = 1;
}

message CameraMetadata {
  uint64 frame_number = 1;
  uint32 width_pixels = 2;
  uint32 height_pixels = 3;
  uint64 exposure_time_ns = 4;
}

message ControllerStatus {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_INITIALIZING = 1;
    STATE_READY = 2;
    STATE_DEGRADED = 3;
    STATE_STOPPED = 4;
  }

  State state = 1;
  string detail = 2;
}

message FaultEvent {
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_WARNING = 1;
    SEVERITY_ERROR = 2;
    SEVERITY_CRITICAL = 3;
  }

  Severity severity = 1;
  uint32 code = 2;
  string message = 3;
}

message TelemetryEvent {
  uint32 schema_version = 1;
  string producer_id = 2;
  uint64 sequence_number = 3;
  int64 source_timestamp_ns = 4;
  ClockDomain source_clock = 5;

  oneof payload {
    Vector3 accelerometer = 10;
    Vector3 gyroscope = 11;
    GpsFix gps = 12;
    Temperature temperature = 13;
    CameraMetadata camera = 14;
    ControllerStatus controller_status = 15;
    FaultEvent fault = 16;
  }
}

message StreamSummary {
  string producer_id = 1;
  uint64 accepted_events = 2;
  uint64 first_sequence_number = 3;
  uint64 last_sequence_number = 4;
  uint64 sequence_gaps = 5;
}

service TelemetryCollector {
  rpc StreamTelemetry(stream TelemetryEvent) returns (StreamSummary);
}
